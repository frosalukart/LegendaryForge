    damage: 18
    radius: 5
    range: 28
  requirements:
    auraskills: {fighting: 40}
    races: []                      # kosong = semua race
  race-bonus:
    angel:  {damage-multiplier: 1.30, cooldown-multiplier: 0.75}
    nephilim: {damage-multiplier: 1.20, cooldown-multiplier: 0.85}
    fallen_angel: {damage-multiplier: 0.80}
  stat-bonus: {wisdom: 25, strength: 10}
  xp-boost: {fighting: 15}

