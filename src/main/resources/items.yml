# =====================================================================
#  items.yml — SATU SECTION = SATU ITEM LEGENDARIS.
#  Tambah item baru: copy salah satu section, ganti id, model-data, lalu /legendary reload
#
#  PENTING (sinergi RaceCore): WeaponSynergyListener bawaan RaceCore mencocokkan
#  nama item (display-name, tanpa warna) dengan kata: "terra breaker", "leviathan",
#  "ignis", "zephyr", "luminance", "void scythe", "stormcaller". Jangan ubah kata itu.
#
#  Field:
#   tier            SUPREME | MID | BASE
#   material        Material dasar item
#   model-data      Custom Model Data (harus sama dengan resource pack & mapping Geyser)
#   attributes      generic.* tanpa prefix: attack_damage, attack_speed, max_health, ...
#   passive.id      ID passive (kode) ; passive.effects = efek konstan saat dipegang
#   skill.trigger   RIGHT_CLICK | SHIFT_RIGHT_CLICK | LEFT_CLICK
#   requirements    auraskills: {skill: level} ; races: [daftar race id RaceCore]
#   race-bonus      bonus bila pemakai race tertentu (damage-multiplier, cooldown-multiplier)
#   stat-bonus      bonus AuraSkills Stat saat dipegang (strength, toughness, wisdom, ...)
#   xp-boost        persen bonus XP AuraSkills per skill saat dipegang
# =====================================================================

# ============================ TIER 1: SUPREME ============================
luminance_scepter:
  tier: SUPREME
  material: BLAZE_ROD
  model-data: 1001
  display-name: "&e&lLuminance Scepter"
  nickname: "&6The Sun's Wrath &7/ &6Hallowed Dawn"
  element: "&eCahaya"
  lore:
    - "&7Ditempa dari pecahan inti matahari purba yang"
    - "&7jatuh ke dimensi Overworld. Dipegang para dewa"
    - "&7pelindung sebelum era kehancuran."
